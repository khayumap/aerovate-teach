  <!-- Tassel / Sparkle -->
  <circle cx="50" cy="35" r="3" fill="#facc15" />
  <line x1="52" y1="24" x2="50" y2="33" stroke="#facc15" stroke-width="2" />
  
  <!-- Science Star at center -->
  <polygon points="32,23 34,28 39,28 35,31 37,36 32,33 27,36 29,31 25,28 30,28" fill="#ffffff" />
</svg>
